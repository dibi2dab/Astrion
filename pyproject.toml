[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astrion"
version = "0.1.0"
description = "Deterministic editorial pipeline for Astrion, a science and mathematics blog on Google Blogger."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "Jinja2>=3.1",
    "pydantic>=2.7",
    "PyYAML>=6.0",
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
astrion = "astrion.cli:main"

[tool.setuptools]
packages = ["astrion"]

[tool.setuptools.package-data]
astrion = ["templates/*.j2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
