title: Why Is the Ocean Salty?
slug: why-is-the-ocean-salty
meta_description: Ocean salt comes from weathered rock and hydrothermal fluids, carried by rivers and balanced over time by processes that remove dissolved ions.
primary_keyword: why is the ocean salty
secondary_keywords:
  - ocean salinity
  - dissolved ions
  - salt budget
  - hydrothermal vents
hook: >-
  Why is the ocean salty? Rain that falls on land is nearly fresh, and rivers
  that feed the sea are usually drinkable, yet the ocean holds enough salt to
  make roughly 35 grams of dissolved solids in every kilogram of seawater. The
  answer is not that rivers pour salt into a stagnant basin. It is a balance
  between slow input, long residence times, and processes that remove ions from
  the water.
core_question: >-
  Where do the dissolved ions in seawater come from, and why has the ocean not
  simply become saltier and saltier over geological time?
explanation_target: >-
  The weathering of continental rock, hydrothermal exchange at mid-ocean
  ridges, the composition of seawater, the ocean's salt budget over millions of
  years, and why salinity varies between seas and with depth.
central_principle: >-
  Seawater is salty because rock-derived ions accumulate in a reservoir with a
  long mixing time, while removal by sedimentation, sea spray, and hydrothermal
  circulation keeps the total concentration roughly steady over geological
  time.
unique_value: >-
  This explanation connects the taste of seawater to the rock cycle and the
  ocean's chemical budget, shows which ions dominate and why, and separates the
  idea of a steady concentration from the false idea that the ocean is a closed
  bucket that only fills up.
key_takeaways:
  - Seawater is about 3.5 percent dissolved solids by mass, dominated by sodium and chloride ions.
  - Most dissolved ions originate from the chemical weathering of continental rock, delivered by rivers over long timescales.
  - Hydrothermal circulation at mid-ocean ridges both adds and removes ions, helping regulate seawater chemistry.
  - The ocean is not getting saltier without limit because removal processes balance the slow input over geological time.
sections:
  - heading: A Measured Mixture
    blocks:
      - type: paragraph
        text: >-
          Salinity is the mass of dissolved salts in a mass of seawater,
          usually reported in grams per kilogram or practical salinity units.
          Average open-ocean salinity is about 35, meaning 35 grams of
          dissolved solids per kilogram of seawater. That is roughly one
          teaspoon of salt in a cup of water, enough to taste clearly and not
          enough to make the sea a brine.
      - type: paragraph
        text: >-
          The dissolved material is not ordinary table salt alone. Sodium and
          chloride dominate, but seawater also contains sulfate, magnesium,
          calcium, potassium, and many trace elements. The relative proportions
          of the major ions are remarkably stable across the open ocean, even
          though the total salinity varies from place to place.
      - type: table
        caption: Sodium and chloride make up most of the dissolved mass in seawater.
        headers:
          - Ion
          - Share of dissolved mass
          - Typical role
        rows:
          - ["Chloride", "about 55 percent", "Charge balance, taste"]
          - ["Sodium", "about 31 percent", "Charge balance, taste"]
          - ["Sulfate", "about 8 percent", "Marine sulfur cycle"]
          - ["Magnesium", "about 4 percent", "Shells, minerals"]
          - ["Calcium", "about 1 percent", "Shells, corals"]
          - ["Potassium", "about 1 percent", "Biological uptake"]
      - type: paragraph
        text: >-
          The stability of the mix is a clue. If each river had a unique
          fingerprint that persisted, seawater composition would vary much more
          from region to region. Instead, mixing and chemical reactions
          smooth the differences. The ocean behaves like a well-stirred
          reservoir with a residence time of thousands of years for many ions.

  - heading: Where the Ions Come From
    blocks:
      - type: paragraph
        text: >-
          The main source is chemical weathering on land. Rainwater is slightly
          acidic because it dissolves carbon dioxide from the atmosphere,
          forming carbonic acid. That weak acid attacks minerals in rock and
          releases ions into soil water and streams. Rivers carry the dissolved
          load to the sea, even though the water itself is not salty to taste.
      - type: paragraph
        text: >-
          Weathering rates depend on climate, rock type, topography, and
          biology. Warm, wet regions with abundant vegetation tend to weather
          faster. Limestone and evaporite deposits dissolve readily, while
          granite resists attack. The composition of the continental crust
          therefore leaves a signature on the chemistry of the ocean.
      - type: paragraph
        text: >-
          A second source is hydrothermal circulation at mid-ocean ridges.
          Seawater seeps into hot, fractured rock, reacts with it, and returns
          through vents. The reactions can remove some ions and add others.
          Hydrothermal fluids are not a simple salt source; they are a chemical
          exchange system that reshapes seawater as it circulates.
      - type: callout
        tone: note
        title: Rivers are not salty, but they carry salt
        text: >-
          The concentration in river water is low, so the input per liter is
          small. The ocean is vast and old, so even a small concentration
          delivered for millions of years adds up to a large total mass.

  - heading: The Ocean's Salt Budget
    blocks:
      - type: paragraph
        text: >-
          A budget tracks inputs and outputs. Inputs include river discharge,
          hydrothermal exchange, atmospheric deposition, and groundwater.
          Outputs include the formation of evaporite deposits, incorporation
          into sediments and pore water, sea spray, and ion exchange with
          oceanic crust. The ocean is not a sealed container.
      - type: paragraph
        text: >-
          The residence time of an ion is the amount in the ocean divided by
          its input or removal rate. Sodium has a residence time of tens of
          millions of years, so it mixes throughout the ocean many times before
          being removed. That long memory is why seawater composition is so
          uniform and so slow to change.
      - type: paragraph
        text: >-
          Over millions of years, the budget has kept salinity within a range
          that supports life. That does not mean the ocean has always had
          exactly today's salinity. During periods when large evaporite basins
          formed, or when ocean circulation changed, salinity shifted. The
          point is that removal processes respond to concentration and keep the
          system from running away.
      - type: paragraph
        text: >-
          A useful analogy is a bathtub with a partly open drain. The tap runs
          slowly, the drain removes water at a rate that depends on the water
          level, and the level settles near a steady value. The ocean's salt
          budget works in a similar feedback sense, though the real chemistry is
          far more complex than a single drain.

  - heading: Why Some Seas Are Saltier
    blocks:
      - type: paragraph
        text: >-
          Salinity varies because evaporation and precipitation differ by
          region. In the subtropics, evaporation exceeds rainfall, so surface
          water becomes saltier and denser. Near the equator and in high
          latitudes, rainfall and river input can dilute the surface layer. The
          Red Sea and the Mediterranean are saltier than the open ocean because
          they lose water to evaporation and exchange only through narrow
          connections.
      - type: paragraph
        text: >-
          Sea ice changes salinity in a different way. When seawater freezes,
          the ice crystal lattice mostly excludes salt, leaving the remaining
          liquid brine saltier. The dense brine sinks and can contribute to
          deep-water formation. Melting sea ice does the reverse, releasing
          relatively fresh water at the surface.
      - type: paragraph
        text: >-
          Estuaries show the transition between river and ocean. Fresh water
          flows out over denser salt water, and mixing depends on tides, wind,
          and the shape of the coast. The result is a gradient rather than a
          sharp boundary, and the gradient supports distinct ecosystems.
      - type: paragraph
        text: >-
          Depth also matters. Below the surface mixed layer, salinity often
          changes rapidly through a halocline. Because salt water is denser
          than fresh water, salinity together with temperature controls the
          vertical stability of the ocean. That stability shapes how heat,
          carbon, and nutrients move between the surface and the deep sea.

  - heading: What Salinity Does to Water and Life
    blocks:
      - type: paragraph
        text: >-
          Salinity affects density, freezing point, and the behavior of water
          molecules. Dissolved ions interfere with the hydrogen-bond network
          that gives water its unusual properties. Salt water freezes at a
          lower temperature than fresh water and is denser at a given
          temperature, which is why salty water can sink beneath fresher water.
      - type: paragraph
        text: >-
          Organisms must manage the osmotic pressure created by dissolved ions.
          A cell in seawater tends to lose water to its surroundings unless it
          actively regulates its internal chemistry. Marine fish, algae, and
          bacteria have evolved different strategies, from pumping ions out to
          accumulating compatible solutes that balance the external
          concentration.
      - type: paragraph
        text: >-
          Salinity also shapes global circulation. Evaporation leaves surface
          water saltier and denser, and cooling makes it denser still. In a few
          high-latitude regions, that dense water sinks and begins a journey
          through the deep ocean. The resulting overturning circulation
          transports heat, carbon, and nutrients around the planet.
      - type: paragraph
        text: >-
          So the saltiness of the sea is a record of the rock cycle, the water
          cycle, and the ocean's internal chemistry. Rivers deliver ions slowly,
          hydrothermal systems exchange them, sediments bury them, and
          circulation mixes them. The ocean tastes salty because those
          processes have been running for a very long time, not because it has
          been quietly accumulating salt without limit.
misconceptions:
  - claim: The ocean is salty because rivers dump salt into it and nothing removes the salt.
    correction: >-
      Rivers do deliver dissolved ions, but the ocean also removes ions through
      evaporite formation, incorporation into sediments and pore water, sea
      spray, and exchange with oceanic crust. Over geological time, removal
      processes roughly balance input, so salinity does not rise without limit.
  - claim: The ocean is equally salty everywhere.
    correction: >-
      Average open-ocean salinity is about 35 grams per kilogram, but it varies
      with evaporation, precipitation, river input, sea-ice formation, and
      depth. The Red Sea and the Mediterranean are saltier than the open ocean,
      while large river mouths and rainy equatorial regions can be fresher.
  - claim: Sea ice is frozen salt water, so melting it adds salt to the ocean.
    correction: >-
      Sea ice mostly excludes salt as it forms, so the ice is relatively fresh
      and the remaining liquid becomes saltier. Melting sea ice therefore
      releases relatively fresh water, while brine rejection during freezing
      can make the underlying water saltier and denser.
